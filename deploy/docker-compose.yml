# Stack de desarrollo local de Aethra.
# Levanta Postgres + la API. El frontend Next.js se corre aparte con `npm run dev`
# durante F0..F1 (más rápido que rebuildear contenedor en cada cambio).
#
# Uso:
#   docker compose -f deploy/docker-compose.yml up -d postgres
#   dotnet run --project apps/api
#
# En F2+ se sumarán satellites y servicios gestionados.

name: aethra

services:
  postgres:
    image: postgres:16-alpine
    container_name: aethra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aethra
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: aethra
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethra -d aethra"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aethra-net

  # api se incluye comentado durante F0 — se corre via `dotnet run` para iteración rápida.
  # Descomentar a partir de F2 cuando hagamos full deploy local.
  #
  # api:
  #   build:
  #     context: ..
  #     dockerfile: deploy/api.Dockerfile
  #   container_name: aethra-api
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     ConnectionStrings__Aethra: Host=postgres;Port=5432;Database=aethra;Username=aethra;Password=changeme
  #     ASPNETCORE_URLS: http://+:8080
  #   ports:
  #     - "5080:8080"
  #   networks:
  #     - aethra-net

volumes:
  postgres-data:
    name: aethra-postgres-data

networks:
  aethra-net:
    name: aethra-net
    driver: bridge
