id: mongo-7
display_name: MongoDB 7
type: MongoDB
version: "7"
image: mongo:7
internal_port: 27017
admin_user: aethra
admin_password_generator: random(32)
env:
  MONGO_INITDB_ROOT_USERNAME: "${admin_user}"
  MONGO_INITDB_ROOT_PASSWORD: "${admin_password}"
  MONGO_INITDB_DATABASE: admin
volumes:
  - name: data
    container_path: /data/db
healthcheck:
  test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
  interval_seconds: 15
  retries: 8
category: Database
description: |
  MongoDB 7 con autenticación habilitada (root via MONGO_INITDB_*).
tags:
  - mongo
  - mongodb
  - nosql
  - document
icon_url: https://cdn.simpleicons.org/mongodb/47A248
binding_supported: true
notes: |
  Bindings crean db.createUser con role readWrite vía MongoDbProvisioner.
